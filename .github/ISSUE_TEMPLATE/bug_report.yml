name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Issues are public. Never post your PIN, passwords, your email or anything you copied that should stay private.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Pick every device where it happens.
      multiple: true
      options:
        - Android
        - iPhone or iPad
        - macOS
        - Windows
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Settings, About.
      placeholder: 1.0.2 (3)
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Device and system version
      description: For example Pixel 8, Android 15, or Windows 11 (run `winver`).
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What you did
      placeholder: |
        1. Copied a text on the Mac
        2. Opened the app on the phone
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: A screenshot or screen recording helps. Drag it here.
    validations:
      required: true
